<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Countdown Tubes</title>
<style>
html,body {
  height:100%; margin:0; padding:0;
  display:flex; flex-direction:column;
  font-family:system-ui;
  background:radial-gradient(circle at center,#1a2a6c,#b21f1f,#fdbb2d);
  color:#fff; overflow:hidden;
}
#wrapper {
  flex:1; display:flex; flex-direction:column; justify-content:space-between;
}
#messageContainer {
  height:10%; display:flex; align-items:center; justify-content:center;
  font-size:2rem; font-weight:bold; text-shadow:0 0 10px #000;
  opacity:0; transition:opacity .4s;
}
#countdownContainer {
  height:70%; display:flex; align-items:flex-end; justify-content:center;
  gap:10px; padding:0 12px;
}
.tube {
  height:100%; border:3px solid rgba(255,255,255,.9); border-radius:14px;
  background:rgba(255,255,255,.08);
  position:relative; overflow:hidden;
}
.water {
  position:absolute; left:0; right:0; bottom:0; height:0%;
  background:linear-gradient(to top,#0048ff,#00e5ff);
  border-radius:10px 10px 0 0; transition:height .25s linear;
}
#controls {
  height:15%; display:flex; align-items:center; justify-content:center;
  gap:10px; flex-wrap:wrap; padding:8px;
}
input[type=number] {
  width:150px; padding:10px; border-radius:8px; border:none; outline:none;
  text-align:center; font-size:1.1rem;
}
input[type=range] {
  width:120px;
  accent-color:#fff;
  cursor:pointer;
}
button {
  padding:10px 14px; border-radius:8px; border:none;
  background:#fff; color:#1a2a6c; font-weight:700; cursor:pointer;
}
button:hover { filter:brightness(.95); }
.flash { animation:flash 1s infinite; }
@keyframes flash { 50%{color:#ff0;} }
#wakeDot {
  position:fixed; bottom:6px; right:10px;
  width:10px; height:10px; border-radius:50%;
  background:#0f0; box-shadow:0 0 8px #0f0; opacity:.6;
}
</style>
</head>
<body>
<div id="wrapper">
  <div id="messageContainer">Time's up!</div>
  <div id="countdownContainer"></div>
  <div id="controls">
    <input id="inputSeconds" type="number" min="1" placeholder="Seconds" />
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <button id="stopBtn">Stop Alarm</button>
    <label style="display:flex;align-items:center;gap:5px;">
      🔉<input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1" title="Alarm volume">
    </label>
  </div>
</div>
<div id="wakeDot" title="Screen awake"></div>

<script>
const container = document.getElementById('countdownContainer');
const input = document.getElementById('inputSeconds');
const msg = document.getElementById('messageContainer');
const wakeDot = document.getElementById('wakeDot');
const volumeSlider = document.getElementById('volumeSlider');

let totalSeconds = 0, startTime = 0, rafId = null, running = false, wakeLock = null;
const alarmAudio = new Audio('alarm.mp3');
alarmAudio.loop = true;
alarmAudio.preload = 'auto';

// 🔉 Volume control
volumeSlider.addEventListener('input', () => {
  alarmAudio.volume = parseFloat(volumeSlider.value);
});

// ⏰ Alarm logic
function startAlarm() {
  msg.style.opacity = 1;
  msg.classList.add('flash');
  alarmAudio.currentTime = 0;
  alarmAudio.play().catch(e => console.log('Playback blocked:', e));
}

function stopAlarm() {
  msg.classList.remove('flash');
  msg.style.opacity = 0;
  try {
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
  } catch (e) {
    console.log('Audio stop error', e);
  }
}

// 💤 Wake Lock
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeDot.style.background = '#0f0';
      wakeLock.addEventListener('release', () => {
        wakeDot.style.background = '#f00';
      });
    } else {
      // Fallback: blinking dot if unsupported
      wakeDot.style.background = '#ff0';
    }
  } catch (e) {
    console.error(e);
    wakeDot.style.background = '#f00';
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock === null) {
    await requestWakeLock();
  }
});

// 🧪 Tube generation
let partialDrained = false; // flag to track if partial tube drain finished

function createTubes(totalSec) {
  container.innerHTML = '';
  const full = Math.floor(totalSec / 60);
@@ -155,21 +157,22 @@

    water.id = 'water' + i;

    // Partial tube starts visually full
    if (i === totalTubes - 1 && partial > 0) {
      water.style.height = '100%';
    }

function startCountdown() {
  partialDrained = false;
  const full = Math.floor(totalSeconds / 60);
  const partial = totalSeconds % 60;
  const totalTubes = full + (partial ? 1 : 0);

  // Start main update loop after partial tube drain
  if (partial > 0) {
    const partialTube = document.getElementById('water' + (totalTubes - 1));
    const targetHeight = (partial / 60) * 100;
    partialTube.style.transition = 'height 0.5s linear';
    partialTube.style.height = targetHeight + '%';

    // Wait 0.5s for drain to finish
    setTimeout(() => {
      partialDrained = true;
      rafId = requestAnimationFrame(update);
    }, 500);
  } else {
    // No partial, start immediately
    rafId = requestAnimationFrame(update);
  }
}

function update() {
  const elapsed = (Date.now() - startTime) / 1000;
  const remaining = Math.max(totalSeconds - elapsed, 0);
  input.value = remaining > 0 ? Math.ceil(remaining) : '';

  const full = Math.floor(totalSeconds / 60);
  const partial = totalSeconds % 60;
  const totalTubes = full + (partial ? 1 : 0);
  let secondsLeft = totalSeconds - elapsed;

  for (let i = totalTubes - 1; i >= 0; i--) {
    const tube = document.getElementById('water' + i);
    if (!tube) continue;

    let tubeSec = Math.min(secondsLeft, 60);

    // Skip partial tube until initial drain finishes
    if (i === totalTubes - 1 && partial > 0 && !partialDrained) {
      continue;
    }

    tube.style.transition = 'height 0.25s linear';
    tube.style.height = (tubeSec / 60 * 100) + '%';

    secondsLeft -= 60;
  }

  if (remaining > 0) {
    rafId = requestAnimationFrame(update);
  } else {
    running = false;
    container.innerHTML = '';
    startAlarm();
  }
}

// 🧭 Controls
document.getElementById('startBtn').addEventListener('click', () => {
  if (running) return;
  const v = Number(input.value);
  if (!v || v <= 0) {
    alert('Enter valid seconds');
    return;
  }
  totalSeconds = Math.ceil(v);
  createTubes(totalSeconds);
  msg.style.opacity = 0;
  startTime = Date.now();
  running = true;
  requestWakeLock();
  rafId = requestAnimationFrame(update);
  if (!document.fullscreenElement)
    document.documentElement.requestFullscreen().catch(() => {});
});

document.getElementById('resetBtn').addEventListener('click', () => {
  running = false;
  cancelAnimationFrame(rafId);
  container.innerHTML = '';
  stopAlarm();
});

document.getElementById('stopBtn').addEventListener('click', stopAlarm);
</script>
</body>
</html>
